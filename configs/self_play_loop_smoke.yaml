# Smoke configuration for self-play loop.
# This file is only for checking the pipeline on a tiny run.

run_name: self_play_smoke
seed: 42
n_iterations: 1
n_scenarios_per_iteration: 5
epochs_per_iteration: 1

pool:
  transitions_csv: data/gridfm_transitions/case118_bootstrap_v1/transitions_train.csv
  raw_dir: data/gridfm_generated/case118_bootstrap_v1/raw
  metadata_path: runs/self_play_smoke/inputs/pool_metadata_smoke.json

  # Quotas are minimums. Caps apply to the remaining weighted fill.
  curriculum:
    never_solved_min_fraction: 0.20
    hard_min_fraction: 0.25
    simple_max_fraction: 0.35
    frontier_max_fraction: 0.50
    frontier_solve_rate_min: 0.25
    frontier_solve_rate_max: 0.75
    learning_progress_weight: 1.00
    uncertainty_weight: 0.75
    staleness_weight: 0.50
    frontier_weight: 0.35
    stale_after_iterations: 3
    priority_floor: 0.05

eval_csv: runs/self_play_smoke/inputs/eval_smoke.csv
eval_raw_dir: data/gridfm_generated/case118_eval_v1/raw

final_test_csv: data/gridfm_transitions/case118_final_test_v1/transitions_balanced.csv
final_test_raw_dir: data/gridfm_generated/case118_final_test_v1/raw

checkpoint_selection:
  enabled: true
  tuning_csv: runs/self_play_smoke/inputs/tuning_smoke.csv
  tuning_raw_dir: data/gridfm_generated/case118_tuning_v1/raw
  candidates_per_metric: 1
  max_candidates: 4
  calibration_bins: 5
  metric: physically_secure_rate_requested
  arena:
    simulations: 2
    pf_alg: 3
    depth: 1
    max_steps: 2
    top_k: 3
    widening_coefficient: 2.0
    widening_exponent: 0.5
    exploration_quota: 1
    random_seed: 42
    gamma: 1.0
    c_puct: 2.0
    prior_exponent: 0.5
    use_continuation_gate: true
    allow_handoff_with_hard_overloads: false
    num_workers: 1
    batch_size: 2
    device: cpu
    output_csv_name: tuning_results.csv
    output_json_name: tuning_metrics.json

bootstrap_checkpoint: runs/bootstrap/best_checkpoint.pt
bootstrap_eval_metrics: runs/bootstrap/eval_metrics_smoke.json
checkpoint_dir: runs/self_play_smoke
best_checkpoint_path: runs/self_play_smoke/checkpoints/best.pt
best_metrics_path: runs/self_play_smoke/checkpoints/best_metrics.json

physics:
  base_mva: 100.0
  pf_alg: 3
  pf_tolerance: 1.0e-8
  max_iterations: 30
  q_limit_policy: enforce
  island_policy: reject
  zero_rate_a_policy: unlimited
  overload_limit_percent: 100.0
  hard_overload_limit_percent: 120.0
  thermal_tolerance_percent: 1.0e-6
  voltage_tolerance_pu: 1.0e-6
  generator_p_tolerance_mw: 1.0e-6
  generator_q_tolerance_mvar: 1.0e-6
  angle_tolerance_degrees: 1.0e-6

replay_buffer:
  max_size: 1000
  min_size_to_train: 5
  fresh_fraction: 0.70
  random_seed: 42
  retention_iterations: 1

generation:
  simulations: 5
  depth: 1
  max_steps: 2
  top_k: 5
  # top_k is the initial switch-action width, not a hard limit.
  widening_coefficient: 2.0
  widening_exponent: 0.5
  exploration_quota: 2
  gamma: 1.0
  c_puct: 2.0
  prior_exponent: 0.5
  use_root_noise: true
  selection_temperature: 1.0
  temperature_steps: 1
  temperature_iterations: 1
  use_continuation_gate: true
  pf_alg: 3
  stop_policy: no_hard_overloads

  # Stable branch slots execute open/close according to current branch_status.
  require_connected_after_switch: true
  min_loading_for_switch_percent: 0.0
  # Populate only with verified normally-open/tie branch IDs.
  # An empty list preserves opening-only behavior.
  closeable_branch_ids: []

training:
  examples_per_iteration: 20
  validation_fraction: 0.20
  min_validation_scenarios: 1
  batch_size: 4
  learning_rate: 0.0003
  value_loss_weight: 1.0
  value_huber_delta: 1.0
  num_workers: 0
  device: cpu
  model_type: graph_v2
  hidden_dim: 128
  num_layers: 3
  dropout: 0.0
  save_multiple_best: false
  no_tensorboard: true

evaluation:
  simulations: 5
  pf_alg: 3
  depth: 1
  max_steps: 2
  top_k: 5
  # top_k is the initial switch-action width, not a hard limit.
  widening_coefficient: 2.0
  widening_exponent: 0.5
  exploration_quota: 2
  # Base seed for deterministic per-scenario MCTS exploration.
  random_seed: 42
  gamma: 1.0
  c_puct: 2.0
  prior_exponent: 0.5
  use_continuation_gate: true
  allow_handoff_with_hard_overloads: false
  num_workers: 1
  batch_size: 2
  device: cpu
  output_csv_name: eval_results.csv
  output_json_name: eval_metrics.json

acceptance:
  metric: physically_secure_rate_requested
  min_improvement: 0.0
  reject_if_failed_scenarios_above: 0
  confidence_level: 0.95
  bootstrap_samples: 5000
metadata:
  save_config_copy_per_iteration: true
  save_dataset_hash: true
  save_config_hash: true
  save_parent_checkpoint: true
  save_reward_config: true
  save_pool_metadata_hash: true
